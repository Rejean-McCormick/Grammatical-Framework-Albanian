schema_id = "gf-wordbench.project"
schema_version = "1.0"

[project]
id = "albanian-rgl-linguistic"
name = "Albanian RGL Linguistic Campaign 500"
language_code = "albanian"
root = "."

[sources]
directory = "AlbanianSQI/GF/lib/src/albanian"
glob = "*.gf"
include_regex = ".*[.]gf$"
exclude_regex = "^$"

[gf]
path_parts = []
minimum_version = "3.12"

[modules]
entrypoints = ["LangSqi.gf", "GrammarSqi.gf", "AllSqi.gf", "DictSqi.gf"]
checkpoints = ["MorphoSqi.gf", "ParadigmsSqi.gf", "GrammarSqi.gf", "LangSqi.gf", "DictSqi.gf"]

[validation]
required_scenarios = [
  "alb-noun-01",
  "alb-noun-02",
  "alb-noun-03",
  "alb-noun-04",
  "alb-noun-05",
  "alb-noun-06",
  "alb-noun-07",
  "alb-noun-08",
  "alb-noun-09",
  "alb-noun-10",
  "alb-verb-01",
  "alb-verb-02",
  "alb-verb-03",
  "alb-verb-04",
  "alb-verb-05",
  "alb-verb-06",
